<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión · Workea</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1430">
<style>
  :root{ --navy:#0a1430; --azul:#1999f1; --bg:#f5f6fb; --ink:#0a1430; --soft:#5b6478; --line:#e7e9f2; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0a1430; --ink:#f2f5ff; --soft:#b5bfd8; --line:#24304f; } }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  main{ max-width:420px; text-align:center; }
  h1{ font-size:22px; margin:0 0 10px; }
  p{ color:var(--soft); line-height:1.55; margin:0 0 18px; }
  a.btn{ display:inline-block; background:var(--azul); color:#fff; text-decoration:none; font-weight:700; padding:12px 20px; border-radius:12px; }
  button{ font:inherit; font-weight:700; background:none; border:2px solid var(--line); color:var(--ink); padding:10px 18px; border-radius:12px; cursor:pointer; margin-left:8px; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>La Bitácora guarda tus postulaciones en tu cuenta, así que necesita internet. Mientras vuelve la señal, puedes calcular cuánto pedir de sueldo: Workea Sueldo funciona sin conexión.</p>
  <a class="btn" href="/sueldo.html">💰 Ir a Workea Sueldo</a><button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
